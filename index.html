<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For you</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3e4e6;--paper:#fffaf7;--ink:#3a2230;--soft:#7a5a68;--rose:#c2415c;--rose2:#e58a9d;--shadow:rgba(80,30,50,.18);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1119;--paper:#2b1a25;--ink:#f6e8ec;--soft:#c9a5b3;--rose:#ee7b94;--rose2:#8a3a50;--shadow:rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#1d1119;--paper:#2b1a25;--ink:#f6e8ec;--soft:#c9a5b3;--rose:#ee7b94;--rose2:#8a3a50;--shadow:rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:Lora,Georgia,serif;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
#app{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;max-width:480px;margin:0 auto;text-align:center}
.hand{font-family:Caveat,'Segoe Script',cursive}
.card{background:var(--paper);border-radius:6px;padding:28px 24px;width:100%;box-shadow:0 10px 30px var(--shadow);animation:in .5s ease}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1{font-family:Caveat,cursive;font-size:2.6rem;margin:0 0 10px;line-height:1.05;color:var(--rose)}
p{line-height:1.65;font-size:1.05rem;margin:0 0 14px}
.btn{font:inherit;font-family:Caveat,cursive;font-size:1.5rem;font-weight:700;background:var(--rose);color:#fff;border:0;border-radius:40px;padding:10px 30px;margin-top:8px;cursor:pointer;box-shadow:0 6px 16px var(--shadow)}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;color:var(--soft);box-shadow:none;border:2px solid var(--rose2)}
.dots{display:flex;gap:6px;justify-content:center;margin-top:18px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--rose2);opacity:.35}
.dots i.on{opacity:1;background:var(--rose)}
/* envelope */
.env{width:240px;height:160px;position:relative;cursor:pointer;margin:0 auto 18px;background:var(--rose);border-radius:6px;box-shadow:0 12px 28px var(--shadow);animation:float 3s ease-in-out infinite}
.env:before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom right,transparent 49%,rgba(0,0,0,.12) 50%) left/50% 100% no-repeat,linear-gradient(to bottom left,transparent 49%,rgba(0,0,0,.12) 50%) right/50% 100% no-repeat;border-radius:6px}
.env:after{content:"♥";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;font-size:2.2rem}
@keyframes float{50%{transform:translateY(-8px)}}
/* photo */
.photo{width:100%;aspect-ratio:4/5;border-radius:4px;background:linear-gradient(135deg,var(--rose2),var(--rose));display:flex;align-items:center;justify-content:center;font-size:3.5rem;overflow:hidden;margin-bottom:12px;transform:rotate(-1.5deg);box-shadow:0 6px 16px var(--shadow)}
.photo.has{aspect-ratio:auto;background:none}.photo img{width:100%;height:auto;display:block;object-fit:cover}
.cap{font-family:Caveat,cursive;font-size:1.6rem;color:var(--soft)}
/* promises */
.prom{background:var(--paper);border:2px dashed var(--rose2);border-radius:10px;padding:16px;margin:0 0 12px;width:100%;cursor:pointer;font-size:1.05rem}
.prom b{font-family:Caveat,cursive;font-size:1.5rem;color:var(--rose);display:block}
.prom span{display:none;color:var(--soft);margin-top:4px}
.prom.open{border-style:solid}.prom.open span{display:block}
#choices{position:relative;height:140px;width:100%}
#choices .btn{position:absolute;top:30px}
#yes{left:calc(50% - 90px)}
#no{left:calc(50% + 10px)}
.heart{position:fixed;bottom:-30px;pointer-events:none;animation:up linear forwards;z-index:9}
@keyframes up{to{transform:translateY(-110vh) rotate(40deg);opacity:0}}
.toggle{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;background:none;border:0;font-size:1.3rem;color:var(--soft);cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

/* ============ END EDIT ============ */

const app=document.getElementById('app');
const steps=[];
const dots=i=>`<div class="dots">${steps.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div>`;
const el=(h)=>{app.innerHTML=h};
let cur=0;

steps.push(()=>`<div class="env" id="env"></div><h1>For ${CONFIG.name}</h1><p class="hand" style="font-size:1.5rem;color:var(--soft)">${CONFIG.envelopeNote}</p>`);
steps.push(()=>`<div class="card"><h1>${CONFIG.title}</h1>${CONFIG.letter.map(l=>`<p>${l}</p>`).join('')}<button class="btn" data-next>Keep reading</button>${dots(1)}</div>`);
CONFIG.memories.forEach((m,i)=>steps.push(()=>`<div class="card"><div class="photo ${m.img?'has':''}">${m.img?`<img src="${m.img}" alt="">`:m.emoji}</div><div class="cap">${m.caption}</div><button class="btn" data-next>Next</button>${dots(2+i)}</div>`));
steps.push(()=>`<div class="card"><h1>${CONFIG.question}</h1><div id="choices"><button class="btn" id="yes">Yes</button><button class="btn ghost" id="no">No</button></div></div>`);

function render(i){
  cur=i;el(steps[i]());
  if(i===0)document.getElementById('env').onclick=()=>render(1);
  app.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>render(cur+1));
  app.querySelectorAll('.prom').forEach(p=>p.onclick=()=>p.classList.toggle('open'));
  if(i===steps.length-1)finale();
  window.scrollTo(0,0);
}
function hearts(n){
  for(let k=0;k<n;k++){
    const h=document.createElement('div');h.className='heart';h.textContent=['❤','💗','💕','🌹'][k%4];
    h.style.left=Math.random()*100+'vw';h.style.fontSize=(18+Math.random()*26)+'px';
    h.style.animationDuration=(2.5+Math.random()*2.5)+'s';h.style.animationDelay=Math.random()*1.2+'s';
    document.body.appendChild(h);setTimeout(()=>h.remove(),7000);
  }
}
function finale(){
  const yes=document.getElementById('yes'),no=document.getElementById('no');let n=0,s=1;
  const dodge=e=>{
    e.preventDefault();
    no.textContent=CONFIG.noTexts[Math.min(n,CONFIG.noTexts.length-1)];n++;
    s=Math.min(s+0.18,1.8);yes.style.transform=`scale(${s})`;
    const box=document.getElementById('choices').getBoundingClientRect();
    no.style.left=Math.max(0,Math.random()*(box.width-no.offsetWidth))+'px';
    no.style.top=(Math.random()*(box.height-no.offsetHeight))+'px';
  };
  no.addEventListener('touchstart',dodge,{passive:false});no.addEventListener('click',dodge);
  yes.onclick=()=>{
    el(`<div class="card"><h1>${CONFIG.yesReply}</h1></div>`);
    hearts(40);setTimeout(()=>hearts(30),2500);
  };
}
document.getElementById('theme').onclick=()=>{
  const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim()==='#1d1119';
  r.setAttribute('data-theme',d?'light':'dark');
};
render(0);
</script>
